; XGO ESP32 firmware: shared build and upload configuration.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.partitions = xgo_two_ota.csv
lib_deps = adafruit/Adafruit NeoPixel@1.12.0
